name: CI


on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:


# Pushing to a PR branch cancels its outdated run; pushes to main and tags
# always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run test
      - run: bun run lint:ci


  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Only the headless shell is downloaded: the projects run headless, so
      # full Chromium would never be launched.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install browser and system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --only-shell --with-deps
      # The browser is cached, the system libraries it links against are not.
      - name: Install system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      # The configs come from `tests/e2e/config`, only the data dir for the
      # test DBs has to exist.
      - name: Setup data dir
        run: mkdir -p server/data
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7


  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `bun install`: the smoke test only imports `bun:test`.
      - uses: oven-sh/setup-bun@v2
      - name: Validate compose file
        run: docker compose config -q
      - name: Setup initial config
        run: |
          mkdir -p server/data
          cp ci/config.smoke.toml server/data/config.toml
      - name: Build images
        run: docker compose build --pull
      - name: Start stack
        run: docker compose up -d
      - name: Smoke test OTP API
        run: bun run test:smoke
      - name: Show container status
        if: always()
        run: docker compose ps
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      # The stack is not torn down: the runner is discarded right after.
