services:
  server:
    build:
      context: .
      dockerfile: infra/server.Dockerfile
    environment:
      TEAMOTP_DB_PATH: "teamotp.db"
    volumes:
      - ./server/data:/app/data
    # No published port: Caddy reaches the API over the compose network.
    # Publishing 3000 would expose the API over plain HTTP and bypass TLS.
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: infra/client.Dockerfile
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
