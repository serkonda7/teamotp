<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/src/img/teamotp_icon.png">
    <title>TeamOTP</title>
    <script>
    // Set the theme before first paint to avoid a flash of the wrong theme
    const storedTheme = localStorage.getItem('teamotp-theme')
    const initialTheme =
      storedTheme === 'light' || storedTheme === 'dark'
        ? storedTheme
        : window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
    document.documentElement.dataset.theme = initialTheme
    </script>
  </head>

  <body>
    <noscript>
      JavaScript muss aktiviert sein, um diese App auszuführen.
    </noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
