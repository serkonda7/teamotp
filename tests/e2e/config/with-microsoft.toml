[auth]
appKey = "e2e-secret-not-used-anywhere-else"
secureCookies = false # e2e runs over plain HTTP

# Parallel workers share one source IP, so keep the login budget generous
[auth.loginRateLimit]
maxAttempts = 10000

# Dummy values: the tests only assert that the provider is offered, they never
# follow the redirect to the Microsoft identity platform.
[auth.microsoft]
clientId = "e2e-client-id"
clientSecret = "e2e-client-secret"
tenantId = "e2e-tenant-id"
redirectUri = "http://localhost:3001/auth/callback/microsoft"
